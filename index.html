<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trial of Titans: The War for the Skies</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--b1:#030b1f;--b2:#0a2a6b;--b3:#1d6fff;--ice:#9fd0ff;--gold:#7fe0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#1a4fc7 0%,#0a2a6b 35%,#030b1f 80%) fixed;color:#fff;font:16px/1.5 Lato,Arial,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s infinite}
.cl{position:absolute;width:260px;height:70px;border-radius:50%;background:radial-gradient(ellipse,rgba(159,208,255,.22),transparent 70%);animation:drift linear infinite}
.jet{position:absolute;width:70px;opacity:.7;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(120vw)}}
@keyframes tw{50%{opacity:.15}}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:12px 16px 40px}
body.flash::after{content:"";position:fixed;inset:0;background:#9fd0ff;opacity:0;animation:fl .5s;z-index:5;pointer-events:none}
@keyframes fl{0%{opacity:.7}100%{opacity:0}}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:Cinzel,serif;font-weight:700;font-size:19px;letter-spacing:3px}
.brand small{display:block;font:400 10px Lato,sans-serif;letter-spacing:2px;color:var(--ice)}
.hr{display:flex;gap:8px;align-items:center}
.chip{font-size:12px;padding:3px 10px;border:1px solid rgba(159,208,255,.5);border-radius:20px}
.tm{font-family:Cinzel,serif;font-weight:700;font-size:19px;border:2px solid var(--ice);border-radius:8px;padding:0 10px;box-shadow:0 0 14px rgba(29,111,255,.6)}
button{min-height:42px;padding:0 18px;border:1px solid rgba(159,208,255,.6);border-radius:8px;background:rgba(10,42,107,.8);color:#fff;font:700 14px Lato,Arial,sans-serif;cursor:pointer;transition:.2s}
button:hover:not(:disabled){background:#1d6fff;transform:translateY(-1px)}
button:disabled{opacity:.4;cursor:default}
button.p{background:linear-gradient(90deg,#1d6fff,#46b8ff);border-color:#fff;box-shadow:0 0 16px rgba(70,184,255,.6)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.mt span{font-size:11px;letter-spacing:1px;color:var(--ice)}
.mt em{display:block;height:8px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
.mt i{display:block;height:100%;background:linear-gradient(90deg,#1d6fff,#7fe0ff);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.arena{position:relative;height:285px;margin:6px 0;border:1px solid rgba(159,208,255,.4);border-radius:16px;background:linear-gradient(#0a2a6b99,#030b1fcc);overflow:hidden}
.arena:before{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(#0d3b94,#030b1f)}
.fg{position:absolute;bottom:20px;text-align:center;font-size:11px;letter-spacing:2px;color:var(--ice)}
.fg svg{display:block;width:100%;height:auto}
.fg.L{left:6%;width:130px;animation:bob 3s ease-in-out infinite}
.fg.R{right:7%;width:150px;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 0 18px #1d6fff)}
.fg.Q{left:50%;margin-left:-45px;width:90px;bottom:60px;opacity:.9;animation:bob 5s ease-in-out infinite}
.enter{animation:inR 1s cubic-bezier(.2,.9,.3,1.1) both!important}
.arena.strike .fg.L{animation:lunge .9s ease-in-out both}
.arena.strike .fg.R{animation:shake .5s .35s 2}
.arena.hit .fg.L{animation:shake .5s 2}
.arena.hit .fg.R{animation:lunge2 .9s both}
.arena.stag .fg.R{animation:shake .5s 2;filter:brightness(2) drop-shadow(0 0 18px #fff)}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes inR{from{transform:translateX(160%) scale(1.3);opacity:0}to{transform:none;opacity:1}}
@keyframes lunge{40%{transform:translateX(min(48vw,420px)) scale(1.15)}100%{transform:none}}
@keyframes lunge2{40%{transform:translateX(max(-48vw,-420px)) scale(1.15)}100%{transform:none}}
@keyframes shake{25%{transform:translateX(-10px) rotate(-3deg)}75%{transform:translateX(10px) rotate(3deg)}}
.eye{animation:tw 1.6s infinite}
.hp{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:38%;text-align:center;font:700 12px Cinzel,serif;letter-spacing:2px}
.hp em{display:block;height:10px;margin-top:3px;border:1px solid var(--ice);border-radius:6px;overflow:hidden;background:#0007}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#46b8ff,#fff);transition:width 1.2s}
.sw{position:absolute;left:14px;top:10px;max-width:24%;font:700 12px Cinzel,serif;letter-spacing:2px;color:var(--ice)}
.card{background:rgba(5,20,55,.82);border:1px solid rgba(159,208,255,.4);border-radius:14px;padding:16px 18px;margin-top:12px;animation:up .5s both;backdrop-filter:blur(4px)}
.k{font-size:11px;letter-spacing:2px;color:var(--gold)}
h1,h2{font-family:Cinzel,serif;margin:2px 0 8px}h1{font-size:34px;letter-spacing:4px}h2{font-size:20px}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.say{display:flex;gap:12px;align-items:flex-end;margin-top:12px;animation:up .5s both}
.say .pt{width:84px;flex:none}.say .pt svg{width:100%;display:block;filter:drop-shadow(0 0 10px #46b8ff);animation:bob 4s infinite}
.bub{flex:1;background:rgba(10,42,107,.85);border:1px solid var(--ice);border-radius:14px;padding:12px 16px}
.bub i{font-style:normal;font-size:11px;letter-spacing:2px;color:var(--gold);display:block}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 14px;min-height:46px;line-height:1.35;animation:up .4s both}
.opt.s{background:linear-gradient(90deg,#1d6fff,#46b8ff);border-color:#fff}
.opt:nth-child(2){animation-delay:.12s}.opt:nth-child(3){animation-delay:.24s}.opt:nth-child(4){animation-delay:.36s}
.alert{background:repeating-linear-gradient(45deg,#c1272d,#c1272d 14px,#7a0f14 14px,#7a0f14 28px);padding:6px 14px;border-radius:8px;font:700 14px Cinzel,serif;letter-spacing:3px;animation:sir .8s infinite;text-align:center}
@keyframes sir{50%{box-shadow:0 0 28px #ff4d4d;filter:brightness(1.4)}}
input,textarea{width:100%;padding:9px;border-radius:8px;border:1px solid var(--ice);background:rgba(3,11,31,.7);color:#fff;font:15px Lato,Arial,sans-serif}
textarea{min-height:84px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:8px}
.out{background:rgba(29,111,255,.2);border-radius:8px;padding:8px 12px;margin-top:8px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.dl{display:inline-block;margin:4px 6px 0 0;padding:3px 10px;border-radius:14px;background:#1d6fff55;border:1px solid var(--ice);animation:chip 1.4s both}
@keyframes chip{0%{opacity:0;transform:translateY(20px) scale(.6)}30%{opacity:1;transform:none}}
.dos{position:fixed;inset:0;background:#030b1fee;z-index:9;overflow:auto;padding:18px}
.dos table,.card table{border-collapse:collapse;min-width:100%}
td,th{padding:5px 9px;border-bottom:1px solid rgba(159,208,255,.25);text-align:left;font-size:13px}th{color:var(--gold)}
.sc{overflow-x:auto}.note{font-size:12px;opacity:.7;text-align:center;margin-top:20px}
.ttl{position:relative;height:200px}.ttl .fg{bottom:0}
@media(max-width:560px){.fg.R{width:120px}.fg.L{width:90px}.fg.Q{display:none}.arena{height:250px}.hp{width:60%;top:34px}.sw{max-width:90%}h1{font-size:24px}}

.fg.L,.fg.R,.fg.Q{animation:breathe 5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scaleY(1.014)}}
.fg.R{filter:drop-shadow(0 0 26px rgba(60,130,255,.35));width:190px}.fg.L{width:120px}.fg.Q{opacity:.55;width:70px;bottom:44px;filter:blur(.4px)}
.arena{height:310px;background:radial-gradient(ellipse at 70% 90%,#12409a55,transparent 60%),linear-gradient(#071a45,#02060f);box-shadow:inset 0 0 60px #000c}
.arena:before{background:linear-gradient(#0a1c46,#02060f)}
.arena:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse,transparent 55%,#000a 100%)}
.mist{position:absolute;left:-10%;right:-10%;bottom:14px;height:80px;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 30% 100%,#6aa8ff30,transparent 60%),radial-gradient(ellipse at 75% 100%,#6aa8ff26,transparent 60%);animation:mist 18s ease-in-out infinite alternate}
@keyframes mist{to{transform:translateX(8%)}}
.em{position:absolute;bottom:30px;width:3px;height:3px;border-radius:50%;background:#9fd0ff;box-shadow:0 0 6px #4aa0ff;opacity:0;animation:em 7s linear infinite;z-index:3}
@keyframes em{10%{opacity:.8}100%{transform:translate(24px,-230px);opacity:0}}
.core{transform-box:fill-box;transform-origin:center;animation:core 3.2s ease-in-out infinite}@keyframes core{50%{opacity:.55;transform:scale(.88)}}
.cape{transform-box:fill-box;transform-origin:100% 0;animation:cape 4.5s ease-in-out infinite}@keyframes cape{50%{transform:skewX(-4deg) scaleX(.96)}}
.imp{position:absolute;left:70%;bottom:90px;width:12px;height:12px;border:1.5px solid #cfe6ff;border-radius:50%;opacity:0;z-index:4}
.arena.hit .imp,.arena.stag.x .imp{left:30%}
.arena.strike .imp,.arena.hit .imp,.arena.stag .imp{animation:ring .9s .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes ring{from{opacity:.9;transform:translate(-50%,0) scale(1)}to{opacity:0;transform:translate(-50%,0) scale(16)}}
.enter{animation:rise 1.8s cubic-bezier(.22,1,.36,1) both!important}
@keyframes rise{from{transform:translateY(46px) scale(1.05);opacity:0;filter:blur(10px)}to{transform:none;opacity:1}}
.arena.strike .fg.L{animation:adv 1s cubic-bezier(.65,0,.35,1) both}
.arena.strike .fg.R{animation:rec .9s .45s cubic-bezier(.22,1,.36,1) both}
.arena.hit .fg.R{animation:advR 1s cubic-bezier(.65,0,.35,1) both}
.arena.hit .fg.L{animation:recL .9s .45s cubic-bezier(.22,1,.36,1) both}
.arena.stag .fg.R{animation:rec .9s cubic-bezier(.22,1,.36,1) both}
@keyframes adv{45%,55%{transform:translateX(min(44vw,380px))}}
@keyframes advR{45%,55%{transform:translateX(max(-44vw,-380px))}}
@keyframes rec{25%{transform:translateX(18px);filter:brightness(1.7) drop-shadow(0 0 26px #6aa8ff)}}
@keyframes recL{25%{transform:translateX(-18px);filter:brightness(1.5)}}
.arena.strike,.arena.hit{animation:cam .6s .45s}
@keyframes cam{15%{transform:translate(-4px,2px)}35%{transform:translate(4px,-2px)}60%{transform:translate(-2px,1px)}}
.eye{animation:eye 3s ease-in-out infinite;filter:drop-shadow(0 0 5px currentColor)}@keyframes eye{50%{opacity:.55}}
.say .pt svg{animation:none;filter:drop-shadow(0 6px 14px #000a)}
.say .pt{width:70px}
.bub{background:linear-gradient(#0a2457cc,#05122ecc);border:1px solid #5d8fe0aa;border-radius:6px;box-shadow:0 8px 24px #0008}
.card{border-radius:6px;background:linear-gradient(#071a45cc,#04102ae6);border-color:#5d8fe055;box-shadow:0 10px 30px #0007}
button{border-radius:4px;background:#0a1f4b;border-color:#5d8fe0;letter-spacing:.5px;font-weight:700}
button:hover:not(:disabled){background:#123a85;transform:none;box-shadow:0 0 0 1px #9fd0ff}
button.p{background:linear-gradient(#2a6be0,#164aa8);border-color:#9fd0ff;box-shadow:none}
.opt{border-radius:4px}.opt.s{background:linear-gradient(#2a6be0,#164aa8);border-color:#cfe6ff}
.alert{background:linear-gradient(90deg,#7a1018,#2a0509);border:1px solid #c1363e;border-radius:3px;padding:7px 14px;font:700 12px Cinzel,serif;letter-spacing:5px;text-align:left;animation:sir 2.4s ease-in-out infinite;box-shadow:none}
@keyframes sir{50%{border-color:#ff6b72;background:linear-gradient(90deg,#9a1822,#2a0509)}}
.tm{border-radius:4px;box-shadow:none;border-color:#5d8fe0}
.dl{border-radius:3px;background:#0a2457;animation:chip 1.2s cubic-bezier(.22,1,.36,1) both}
.cl{filter:blur(14px);opacity:.5}.jet{opacity:.22;width:40px}.hp em{height:6px;border-radius:2px}.hp i{background:linear-gradient(90deg,#2a6be0,#9fd0ff)}
body.flash::after{background:#cfe6ff;animation:fl .7s ease-out}@keyframes fl{0%{opacity:.18}100%{opacity:0}}
@media(max-width:560px){.arena{height:260px}.fg.R{width:130px}.fg.L{width:84px}}

.lay{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
.lay aside{position:sticky;top:10px}
.lay aside .card{margin-top:0;margin-bottom:12px}
.ex{margin-top:8px}.ex p{font-size:12px;opacity:.75;margin:4px 0 8px}.ex td,.ex th{padding:4px 7px;font-size:13px}
.pips{display:flex;gap:6px;margin:10px 0 2px}.pips i{flex:1;height:4px;border-radius:2px;background:#ffffff22;transition:.6s}.pips i.d{background:#4aa0ff}.pips i.c{background:#cfe6ff;box-shadow:0 0 8px #6aa8ff}
#app{max-width:1180px}.arena{height:270px}.fg.R{width:165px}.fg.L{width:104px}
@media(max-width:860px){.lay{grid-template-columns:1fr}.lay aside{position:static}}
</style>
</head>
